name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s services/company-search -p 'test_*.py'
      - run: pnpm build
      - run: pnpm exec wrangler deploy --dry-run --outdir /tmp/api -c wrangler.api.jsonc
      - run: pnpm exec wrangler deploy --dry-run --outdir /tmp/redirect -c wrangler.redirect.jsonc
      - run: pnpm exec wrangler pages functions build functions --outdir /tmp/pages
